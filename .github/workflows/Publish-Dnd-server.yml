name: Publish DndServer ASP.NET App

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    env:
      PROJECT_PATH: DndServer/DndServer.csproj
      LOCAL_PUBLISH_PATH: ${{ github.workspace }}\publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish project
        run: dotnet publish $env:PROJECT_PATH -c Release -o ./publish

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: DndServer-Published
          path: publish

      - name: Zip published files
        run: |
          Write-Host "Current directory: $(Get-Location)"
          Compress-Archive -Path "$env:LOCAL_PUBLISH_PATH\*" -DestinationPath "$env:LOCAL_PUBLISH_PATH\package.zip"
        shell: pwsh

      - name: Install Web Deploy
        run: |
          choco install webdeploy -y

      - name: Deploy to IIS via Web Deploy
        shell: pwsh
        env:
          LOCAL_PUBLISH_PATH: ${{ github.workspace }}\publish
        run: |
          $msdeploy = 'C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe'

          if (-not (Test-Path $msdeploy)) {
            Write-Error "msdeploy.exe not found at $msdeploy"
            exit 1
          }

          Write-Host "Checking if package exists at $localPublishPath\package.zip"
          if (-Not (Test-Path "$localPublishPath\package.zip")) {
          Write-Error "Package file not found!"
          exit 1
          }

          # Hardcoded credentials
          $server = "https://www.tudor-enterprises.com:8172/msdeploy.axd?site=PrimaryServer"
          $site = "PrimaryServer"
          $user = "deployuser"
          $pass = "UxXW8gbfJbyrrBlFDNOf"
          $localPublishPath = $env:LOCAL_PUBLISH_PATH

          $packagePath = Join-Path $localPublishPath 'package.zip'
          $sourceArg = "-source:package=`"$packagePath`""
          $destArg = "-dest:iisApp=`"$site`",computerName=`"$server`",userName=`"$user`",password=`"$pass`",authType=`"Basic`""

          Write-Host "msdeploy path: $msdeploy"
          Write-Host "source: $sourceArg"
          Write-Host "dest: $destArg"

          $args = @(
            '-verb:sync'
            $sourceArg
            $destArg
            '-allowUntrusted'
            '-verbose'
          ) 

          $proc = Start-Process -FilePath $msdeploy -ArgumentList $args -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Error "msdeploy failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }