name: Publish DndServer ASP.NET App

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    env:
      PROJECT_PATH: DndServer/DndServer.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish project
        run: dotnet publish $env:PROJECT_PATH -c Release -o ./publish

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: DndServer-Published
          path: publish

      - name: Install Web Deploy
        run: |
          choco install webdeploy -y

      - name: Deploy to IIS via Web Deploy
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          & $msdeploy `
            -verb:sync `
            "-source:contentPath=publish" `
            "-dest:contentPath='C:\Program Files\PrimaryServer\publish',computerName=https://${{ secrets.WEBDEPLOY_SERVER }}:8172/msdeploy.axd?site=${{ secrets.WEBDEPLOY_SITE_NAME }},userName=${{ secrets.WEBDEPLOY_USERNAME }},password=${{ secrets.WEBDEPLOY_PASSWORD }},authType=Basic" `
            -allowUntrusted `
            -verbose