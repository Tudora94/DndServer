name: Publish DndServer ASP.NET App

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    env:
      PROJECT_PATH: DndServer/DndServer.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish project
        run: dotnet publish $env:PROJECT_PATH -c Release -o ./publish

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: DndServer-Published
          path: publish

      - name: Install Web Deploy
        run: |
          choco install webdeploy -y

      - name: Deploy to IIS via Web Deploy
        shell: pwsh
        env:
          WEBDEPLOY_SERVER: ${{ secrets.WEBDEPLOY_SERVER }}
          WEBDEPLOY_SITE_NAME: ${{ secrets.WEBDEPLOY_SITE_NAME }}
          WEBDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: |
          $msdeploy = 'C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe'

          if (-not (Test-Path $msdeploy)) {
            Write-Error "msdeploy.exe not found at $msdeploy"
            exit 1
          }

          $server = $env:WEBDEPLOY_SERVER
          $site   = $env:WEBDEPLOY_SITE_NAME
          $user   = $env:WEBDEPLOY_USERNAME
          $pass   = $env:WEBDEPLOY_PASSWORD

          Write-Host "==== Debug Info ===="
          Write-Host "Server: $server"
          Write-Host "Site: $site"
          Write-Host "Local source path: publish"
          Write-Host "===================="

          $sourceArg = '-source:contentPath="PrimaryServer"'
          $destArg = '-dest:contentPath="PrimaryServer",computerName="https://' + $server + ':8172/msdeploy.axd?site=' + $site + '",userName="' + $user + '",password="' + $pass + '",authType="Basic"'

          Write-Host "msdeploy path: $msdeploy"
          Write-Host "source: PrimaryServer"
          Write-Host "dest computerName: https://$server:8172/msdeploy.axd?site=$site"
          Write-Host "dest contentPath: C:\Program Files\PrimaryServer\publish"

          $args = @(
            '-verb:sync'
            $sourceArg
            $destArg
            '-allowUntrusted'
            '-verbose'
          )

          $proc = Start-Process -FilePath $msdeploy -ArgumentList $args -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Error "msdeploy failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }
